[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json-fold"
version = "0.1.0"
description = "A fast, offline, cross-platform JSON viewer and editor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JSON Fold contributors" }]
keywords = ["json", "viewer", "editor", "desktop", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "Programming Language :: Python :: 3",
  "Topic :: Text Editors",
]

[project.gui-scripts]
json-fold = "jsonfold.app:main"

[tool.setuptools.packages.find]
include = ["jsonfold*"]

